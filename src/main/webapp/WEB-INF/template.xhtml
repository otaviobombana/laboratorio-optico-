<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      lang="pt-BR">

<h:head>
    <f:facet name="first">
        <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </f:facet>

    <title>
        <ui:insert name="title">Laboratório Óptico</ui:insert>
    </title>

    <ui:insert name="head"/>
</h:head>

<h:body styleClass="app">

    <ui:include src="sidebar.xhtml"/>

    <div class="app-main">
        <ui:include src="topbar.xhtml"/>

        <main class="app-content">
            <ui:insert name="content"/>
        </main>

        <ui:include src="footer.xhtml"/>
    </div>

    <!-- fundo escuro que aparece atrás do menu no celular -->
    <div class="app-mascara" onclick="document.body.classList.remove('menu-aberto')"></div>

    <p:ajaxStatus style="width:32px;height:32px;position:fixed;right:12px;bottom:12px;z-index:1000">
        <f:facet name="start">
            <i class="pi pi-spin pi-spinner" style="font-size:24px;color:#06a6c7"/>
        </f:facet>
        <f:facet name="complete">
            <h:outputText value=""/>
        </f:facet>
    </p:ajaxStatus>

    <h:outputStylesheet name="css/primeicons.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/primeflex.min.css" library="manhattan-layout"/>
    <h:outputStylesheet name="css/layout-cyan-deeporange.css" library="manhattan-layout"/>

    <style>
        :root {
            --cor-principal: #06a6c7;
            --cor-principal-escura: #0e7490;
            --menu-largura: 250px;
            --topo-altura: 60px;
        }

        body.app {
            margin: 0;
            background: #f1f5f9;
            font-family: "Source Sans Pro", Arial, sans-serif;
        }

        /* ---------- MENU LATERAL ---------- */
        .app-menu {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--menu-largura);
            background: #ffffff;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            z-index: 900;
            transition: transform 0.2s ease;
        }
        .app-menu-logo {
            height: var(--topo-altura);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
        }
        .app-menu-logo i {
            font-size: 24px;
            color: var(--cor-principal);
        }
        .app-menu-titulo {
            padding: 20px 20px 8px;
            color: #94a3b8;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .app-menu ul {
            list-style: none;
            margin: 0;
            padding: 0 12px;
        }
        .app-menu li {
            margin-bottom: 4px;
        }
        .app-menu-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 8px;
            color: #475569;
            font-weight: 600;
            text-decoration: none;
        }
        .app-menu-link i {
            font-size: 17px;
            color: #94a3b8;
        }
        .app-menu-link:hover {
            background: #f1f5f9;
            color: #1e293b;
        }
        .app-menu-link.ativo {
            background: #e0f7fb;
            color: var(--cor-principal-escura);
        }
        .app-menu-link.ativo i {
            color: var(--cor-principal);
        }
        .app-menu-rodape {
            margin-top: auto;
            padding: 14px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
            color: #94a3b8;
            font-size: 11px;
        }

        /* ---------- ÁREA PRINCIPAL ---------- */
        .app-main {
            margin-left: var(--menu-largura);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- TOPO ---------- */
        .app-topo {
            position: sticky;
            top: 0;
            z-index: 800;
            height: var(--topo-altura);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }
        .app-topo-esquerda {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #334155;
            font-size: 16px;
            font-weight: 600;
        }
        .app-botao-menu {
            display: none;
            border: 0;
            background: transparent;
            color: #334155;
            font-size: 20px;
            cursor: pointer;
        }
        .app-topo-direita {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-usuario {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #475569;
            font-weight: 600;
        }
        .app-usuario .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e0f7fb;
            color: var(--cor-principal-escura);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-topo form {
            margin: 0;
        }

        /* ---------- CONTEÚDO E RODAPÉ ---------- */
        .app-content {
            flex: 1;
            padding: 24px;
        }
        .app-rodape {
            display: flex;
            justify-content: space-between;
            padding: 14px 24px;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            color: #94a3b8;
            font-size: 12px;
        }

        /* ---------- CELULAR / TELA PEQUENA ---------- */
        .app-mascara {
            display: none;
        }
        @media (max-width: 900px) {
            .app-menu {
                transform: translateX(-100%);
            }
            body.menu-aberto .app-menu {
                transform: translateX(0);
            }
            body.menu-aberto .app-mascara {
                display: block;
                position: fixed;
                inset: 0;
                background: rgba(15, 23, 42, 0.35);
                z-index: 850;
            }
            .app-main {
                margin-left: 0;
            }
            .app-botao-menu {
                display: block;
            }
            .app-usuario .nome {
                display: none;
            }
            .app-content {
                padding: 16px;
            }
        }
    </style>

</h:body>
</html>
