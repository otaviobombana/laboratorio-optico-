<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui"
    template="/WEB-INF/template.xhtml">

    <ui:define name="title">
        Pedidos de Lentes
    </ui:define>

    <ui:define name="content">

        <h:form id="form">

            <p:growl id="mensagens" showDetail="true" life="4000"/>

            <!-- ===================== DADOS DO PEDIDO ===================== -->
            <p:panel id="cadastro"
                     header="#{pedidoController.pedido.id == null ? 'Novo pedido' : 'Editando pedido nº ' += pedidoController.pedido.id}">

                <p:panelGrid columns="4"
                             layout="grid"
                             styleClass="ui-fluid"
                             columnClasses="ui-grid-col-2,ui-grid-col-4,ui-grid-col-2,ui-grid-col-4">

                    <p:outputLabel for="otica" value="Ótica"/>
                    <p:selectOneMenu id="otica"
                                     value="#{pedidoController.pedido.otica}"
                                     filter="true"
                                     filterMatchMode="contains"
                                     required="true"
                                     requiredMessage="Escolha a ótica do pedido.">
                        <f:selectItem itemLabel="Selecione..." itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{pedidoController.oticas}"
                                       var="o"
                                       itemLabel="#{o.nome}"
                                       itemValue="#{o}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="paciente" value="Paciente"/>
                    <p:inputText id="paciente"
                                 value="#{pedidoController.pedido.paciente}"
                                 maxlength="150"
                                 required="true"
                                 requiredMessage="Informe o nome do paciente."/>

                    <p:outputLabel for="dataPedido" value="Data do pedido"/>
                    <p:datePicker id="dataPedido"
                                  value="#{pedidoController.pedido.dataPedido}"
                                  pattern="dd/MM/yyyy"
                                  locale="pt"
                                  showIcon="true"
                                  required="true"
                                  requiredMessage="Informe a data do pedido."/>

                    <p:outputLabel for="dataPrevisao" value="Previsão de entrega"/>
                    <p:datePicker id="dataPrevisao"
                                  value="#{pedidoController.pedido.dataPrevisao}"
                                  pattern="dd/MM/yyyy"
                                  locale="pt"
                                  showIcon="true"/>

                    <p:outputLabel for="status" value="Status"/>
                    <p:selectOneMenu id="status"
                                     value="#{pedidoController.pedido.status}"
                                     required="true">
                        <f:selectItems value="#{pedidoController.statusPossiveis}"
                                       var="s"
                                       itemLabel="#{s.descricao}"
                                       itemValue="#{s}"/>
                    </p:selectOneMenu>

                    <p:outputLabel for="observacao" value="Observação"/>
                    <p:inputTextarea id="observacao"
                                     value="#{pedidoController.pedido.observacao}"
                                     maxlength="500"
                                     rows="2"
                                     autoResize="false"/>

                </p:panelGrid>

                <!-- ===================== ITENS (one-to-many) ===================== -->
                <h3 style="margin:20px 0 10px">Itens do pedido</h3>

                <p:panelGrid id="novoItem"
                             columns="4"
                             layout="grid"
                             styleClass="ui-fluid"
                             columnClasses="ui-grid-col-4,ui-grid-col-4,ui-grid-col-2,ui-grid-col-2">

                    <p:outputLabel for="lenteItem" value="Lente"/>
                    <p:outputLabel for="armacaoItem" value="Armação (opcional)"/>
                    <p:outputLabel for="quantidadeItem" value="Quantidade"/>
                    <h:outputText value=" "/>

                    <p:selectOneMenu id="lenteItem"
                                     value="#{pedidoController.lenteItem}"
                                     filter="true"
                                     filterMatchMode="contains">
                        <f:selectItem itemLabel="Selecione a lente..." itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{pedidoController.lentes}"
                                       var="l"
                                       itemLabel="#{l.codigo} - #{l.descricao}"
                                       itemValue="#{l}"/>
                    </p:selectOneMenu>

                    <p:selectOneMenu id="armacaoItem"
                                     value="#{pedidoController.armacaoItem}"
                                     filter="true"
                                     filterMatchMode="contains">
                        <f:selectItem itemLabel="Sem armação" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{pedidoController.armacoes}"
                                       var="a"
                                       itemLabel="#{a.descricaoCompleta}"
                                       itemValue="#{a}"/>
                    </p:selectOneMenu>

                    <p:spinner id="quantidadeItem"
                               value="#{pedidoController.quantidadeItem}"
                               min="1"
                               max="99"/>

                    <p:commandButton value="Adicionar"
                                     icon="pi pi-plus"
                                     action="#{pedidoController.adicionarItem}"
                                     process="@this lenteItem armacaoItem quantidadeItem"
                                     update="novoItem itens mensagens"/>

                </p:panelGrid>

                <p:dataTable id="itens"
                             value="#{pedidoController.pedido.itens}"
                             var="item"
                             emptyMessage="Nenhum item adicionado."
                             style="margin-top:10px">

                    <p:column headerText="Lente">
                        <h:outputText value="#{item.lente.codigo} - #{item.lente.descricao}"/>
                    </p:column>

                    <p:column headerText="Armação">
                        <h:outputText value="#{item.armacao != null ? item.armacao.descricaoCompleta : '—'}"/>
                    </p:column>

                    <p:column headerText="Qtd." width="70" style="text-align:center">
                        <h:outputText value="#{item.quantidade}"/>
                    </p:column>

                    <p:column headerText="Valor unit.">
                        <h:outputText value="#{item.valorUnitario}">
                            <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Subtotal">
                        <h:outputText value="#{item.subtotal}">
                            <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="" width="60">
                        <p:commandButton icon="pi pi-trash"
                                         title="Remover item"
                                         action="#{pedidoController.removerItem(item)}"
                                         process="@this"
                                         update=":form:itens"
                                         styleClass="ui-button-danger ui-button-flat"/>
                    </p:column>

                    <p:columnGroup type="footer">
                        <p:row>
                            <p:column colspan="4" footerText="Total do pedido:" style="text-align:right"/>
                            <p:column>
                                <f:facet name="footer">
                                    <h:outputText value="#{pedidoController.pedido.valorTotal}">
                                        <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                                    </h:outputText>
                                </f:facet>
                            </p:column>
                            <p:column/>
                        </p:row>
                    </p:columnGroup>

                </p:dataTable>

                <p:separator/>

                <p:commandButton value="Salvar pedido"
                                 icon="pi pi-save"
                                 action="#{pedidoController.salvar}"
                                 process="cadastro"
                                 update="cadastro tabela mensagens"
                                 styleClass="ui-button-success"/>

                <p:commandButton value="Novo pedido"
                                 icon="pi pi-plus"
                                 action="#{pedidoController.novo}"
                                 process="@this"
                                 update="cadastro"
                                 styleClass="ui-button-secondary"
                                 style="margin-left:8px">
                    <p:resetInput target="cadastro"/>
                </p:commandButton>

            </p:panel>

            <p:spacer height="15"/>

            <!-- ===================== LISTA DE PEDIDOS ===================== -->
            <p:panel header="Pedidos cadastrados">

                <p:outputLabel for="filtroStatus" value="Filtrar por status " style="margin-right:8px"/>
                <p:selectOneMenu id="filtroStatus" value="#{pedidoController.filtroStatus}">
                    <f:selectItem itemLabel="Todos" itemValue="#{null}" noSelectionOption="true"/>
                    <f:selectItems value="#{pedidoController.statusPossiveis}"
                                   var="s"
                                   itemLabel="#{s.descricao}"
                                   itemValue="#{s}"/>
                    <p:ajax listener="#{pedidoController.atualizarLista}" update="tabela"/>
                </p:selectOneMenu>

                <p:separator/>

                <p:dataTable id="tabela"
                             value="#{pedidoController.pedidos}"
                             var="p"
                             emptyMessage="Nenhum pedido encontrado."
                             paginator="true"
                             rows="10">

                    <p:column headerText="Nº" width="60">
                        <h:outputText value="#{p.id}"/>
                    </p:column>

                    <p:column headerText="Data">
                        <h:outputText value="#{p.dataPedido}">
                            <f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Ótica">
                        <h:outputText value="#{p.otica.nome}"/>
                    </p:column>

                    <p:column headerText="Paciente">
                        <h:outputText value="#{p.paciente}"/>
                    </p:column>

                    <p:column headerText="Previsão">
                        <h:outputText value="#{p.dataPrevisao}">
                            <f:convertDateTime type="localDate" pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Itens" style="text-align:center">
                        <h:outputText value="#{p.quantidadeTotal}"/>
                    </p:column>

                    <p:column headerText="Total">
                        <h:outputText value="#{p.valorTotal}">
                            <f:convertNumber type="currency" currencySymbol="R$ " locale="pt_BR"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Status">
                        <p:tag value="#{p.status.descricao}" severity="#{p.status.cor}"/>
                    </p:column>

                    <p:column headerText="Ações" width="120">

                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         action="#{pedidoController.editar(p)}"
                                         process="@this"
                                         update=":form:cadastro :form:mensagens"
                                         styleClass="ui-button-warning"
                                         style="margin-right:5px">
                            <p:resetInput target=":form:cadastro"/>
                        </p:commandButton>

                        <p:commandButton icon="pi pi-trash"
                                         title="Excluir"
                                         action="#{pedidoController.excluir(p)}"
                                         process="@this"
                                         update=":form:tabela :form:cadastro :form:mensagens"
                                         styleClass="ui-button-danger">
                            <p:confirm header="Confirmação"
                                       message="Deseja realmente excluir este pedido e seus itens?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>

            <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
                <p:commandButton value="Sim"
                                 type="button"
                                 styleClass="ui-confirmdialog-yes ui-button-danger"
                                 icon="pi pi-check"/>
                <p:commandButton value="Não"
                                 type="button"
                                 styleClass="ui-confirmdialog-no ui-button-secondary"
                                 icon="pi pi-times"/>
            </p:confirmDialog>

        </h:form>

    </ui:define>

</ui:composition>
